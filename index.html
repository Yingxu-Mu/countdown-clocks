<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe6" />
    <meta
      name="description"
      content="Run several countdown clocks at once. Add, delete, pause, and restyle each one."
    />
    <title>Clocks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=JetBrains+Mono:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #f3efe6; }
      html[data-theme='signal'] { background: #101114; }
      html[data-theme='tide'] { background: #e4f1ee; }
    </style>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('countdown-clocks.settings.v1')
          var theme = 'paper'
          if (raw) {
            var parsed = JSON.parse(raw)
            if (
              parsed &&
              (parsed.theme === 'paper' || parsed.theme === 'signal' || parsed.theme === 'tide')
            ) {
              theme = parsed.theme
            }
          }
          document.documentElement.setAttribute('data-theme', theme)
          var colors = { paper: '#f3efe6', signal: '#101114', tide: '#e4f1ee' }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', colors[theme])
        } catch (error) {
          /* keep the default theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
